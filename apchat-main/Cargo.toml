[package]
name = "apchat"
version = "0.1.0"
edition = "2021"
default-run = "apchat"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
clap_complete = "4.5"
colored = "2.1"
dirs = "5.0"  # Added dirs crate for home directory resolution
dotenvy = "0.15"
futures = "0.3"
futures-util = "0.3"
glob = "0.3"
ignore = "0.4"
lazy_static = "1.4"
apchat-llm-api = { path = "../crates/apchat-llm-api" }
apchat-progress = { path = "../crates/apchat-progress" }
apchat-logging = { path = "../crates/apchat-logging" }
apchat-models = { path = "../crates/apchat-models" }
apchat-mspc = { path = "../crates/apchat-mspc" }
apchat-policy = { path = "../crates/apchat-policy" }
apchat-skills = { path = "../crates/apchat-skills" }
apchat-terminal = { path = "../crates/apchat-terminal" }
apchat-todo = { path = "../crates/apchat-todo" }
apchat-toolcore = { path = "../crates/apchat-toolcore" }
apchat-tools = { path = "../crates/apchat-tools" }
apchat-webex = { path = "../crates/apchat-webex" }
apchat-vty = { path = "../crates/apchat-vty" }
apchat-common = { path = "../crates/apchat-common" }
apchat-finserv = { path = "../crates/apchat-finserv" }
lopdf = "0.39"
once_cell = "1.18"
flate2 = "1.0"
hex = "0.4"
portable-pty = "0.8"
regex = "*"
serde_json = "1.0"
thiserror = "1.0"
tokio-util = "0.7"
toml = "0.8"
tower = "0.4"
vt100 = "0.15"
walkdir = "2.5"

[dependencies.sqlx]
features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"]
version = "0.7"



[dependencies.axum]
features = [
    "ws",
    "macros",
]
version = "0.7"

[dependencies.chrono]
features = ["serde"]
version = "0.4.42"

[dependencies.clap]
features = [
    "derive",
    "env",
]
version = "4.5"

[dependencies.reqwest]
features = [
    "json",
    "stream",
]
version = "0.12"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dependencies.similar]
features = ["inline"]
version = "2.6"

[dependencies.tokio]
features = ["full"]
version = "1.41"

[dependencies.tower-http]
features = [
    "fs",
    "cors",
    "trace",
]
version = "0.5"

[dependencies.uuid]
features = [
    "v4",
    "serde",
]
version = "1.0"

[features]
default = ["python-sandbox"]
embeddings = ["fastembed"]
forecasting = ["apchat-tools/forecasting"]
python-sandbox = ["apchat-tools/python-sandbox"]

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(unix)".dependencies.fastembed]
optional = true
version = "5"

[dev-dependencies]
tempfile = "3.10"
