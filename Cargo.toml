[workspace]
members = [
    "apchat-main",
    "crates/apchat-common",
    "crates/apchat-core",
    "crates/apchat-models",
    "crates/apchat-progress",
    "crates/apchat-logging",
    "crates/apchat-llm-api",
    "crates/apchat-mspc",
    "crates/apchat-todo",
    "crates/apchat-policy",
    "crates/apchat-skills",
    "crates/apchat-terminal",
    "crates/apchat-toolcore",
    "crates/apchat-tools",
    "crates/apchat-memory",
    "crates/apchat-vty",
    "crates/apchat-webex",
    "crates/apchat-tool-pty-server",
    "crates/apchat-mcp-pty-server",
    "crates/apchat-finserv",
    "crates/apchat-designer",
    "crates/apchat-ocr",
    "crates/apchat-types",
    "crates/apchat-pptx",
    "crates/mockllm",
]
resolver = "2"

[workspace.lints.rust]
unused_must_use = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[workspace.dependencies]
# Testing dependencies shared across workspace
tokio-test = "0.4"
tempfile = "3.10"
mockall = "0.12"
pretty_assertions = "1.4"
wiremock = "0.5"
serde_json = "1.0"
proptest = "1.0"
tokio = { version = "1.41", features = ["full"] }
serial_test = "3.0"
env_logger = "0.11"
apchat-types = { path = "crates/apchat-types" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
anyhow = "1.0"
