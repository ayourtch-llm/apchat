[package]
name = "apchat-toolcore"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
colored = "2.1"
apchat-models = { path = "../apchat-models" }
apchat-policy = { path = "../apchat-policy" }
apchat-terminal = { path = "../apchat-terminal" }
apchat-skills = { path = "../apchat-skills" }
apchat-todo = { path = "../apchat-todo" }
apchat-llm-api = { path = "../apchat-llm-api" }
apchat-logging = { path = "../apchat-logging" }
apchat-vty = { path = "../apchat-vty" }
apchat-mspc = { path = "../apchat-mspc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["sync"] }
tokio-util = "0.7"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
tempfile = "3.10"
lazy_static = "1.5"

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
mockall = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }
serial_test = { workspace = true }
