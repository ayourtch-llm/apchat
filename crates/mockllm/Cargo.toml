[package]
name = "mockllm"
version = "0.1.0"
edition = "2021"
description = "A deterministic mock LLM server for testing. Speaks OpenAI-compatible chat completions API with scripted response sequences, tool calling, and streaming (SSE)."
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
http-body-util = "0.1"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
