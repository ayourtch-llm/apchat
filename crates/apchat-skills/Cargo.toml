[package]
name = "apchat-skills"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
apchat-logging = { path = "../apchat-logging" }
apchat-vty= { path = "../apchat-vty" }
apchat-common = { path = "../apchat-common" }

[features]
default = []
embeddings = ["fastembed"]
candle = ["embeddings", "candle-core", "candle-transformers", "tokenizers"]

[target."cfg(unix)".dependencies.fastembed]
optional = true
version = "5"

[dependencies.candle-core]
version = "0.7"
optional = true
features = ["metal"]

[dependencies.candle-transformers]
version = "0.7"
optional = true

[dependencies.tokenizers]
version = "0.19"
optional = true
default-features = false

[dependencies.reqwest]
version = "0.12"
optional = true
features = ["blocking", "json"]
