[package]
name = "apchat-ocr"
version = "0.1.0"
edition = "2021"
description = "OCR tool using GLM-OCR with CLI and MCP server modes"

[[bin]]
name = "apchat-ocr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
