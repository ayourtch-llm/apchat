[package]
name = "apchat-ocr"
version = "0.1.0"
edition = "2021"
description = "OCR tool using GLM-OCR with CLI and MCP server modes"

[[bin]]
name = "apchat-ocr"
path = "src/main.rs"

[features]
default = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers", "dep:hf-hub", "dep:image"]
cuda = ["candle", "candle-core/cuda"]
metal = ["candle", "candle-core/metal"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }

# Optional candle dependencies for local inference
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.4", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tempfile = { workspace = true }
