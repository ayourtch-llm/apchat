[package]
name = "apchat-webex"
version = "0.1.0"
edition = "2021"

[dependencies]
webex = "0.10"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
async-trait = "0.1"

# Internal dependencies
apchat = { path = "../../apchat-main" }
apchat-logging = { path = "../apchat-logging" }
