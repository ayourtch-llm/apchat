[package]
name = "apchat-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.21"
chrono = "0.4.42"
colored = "2.1"
dirs = "5.0"
glob = "0.3"
html2md = "0.2"
ignore = "0.4"
apchat-logging = { path = "../apchat-logging" }
apchat-models = { path = "../apchat-models" }
apchat-llm-api = { path = "../apchat-llm-api" }
apchat-mspc = { path = "../apchat-mspc" }
apchat-policy = { path = "../apchat-policy" }
apchat-skills = { path = "../apchat-skills" }
apchat-terminal = { path = "../apchat-terminal" }
apchat-todo = { path = "../apchat-todo" }
apchat-common = { path = "../apchat-common" }
apchat-toolcore = { path = "../apchat-toolcore" }
apchat-vty = { path = "../apchat-vty" }
apchat-webex = { path = "../apchat-webex" }
regex = "*"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
similar = { version = "2.6", features = ["inline"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
strsim = "0.11"
thiserror = "1.0"
tokio = { version = "1.41", features = ["fs", "process"] }
tempfile = "3"
uuid = { version = "1.0", features = ["v4", "serde"] }
lopdf = "0.39"
flate2 = "1.0"
ouros = { git = "https://github.com/parcadei/ouros.git", optional = true }

[features]
default = []
forecasting = ["dep:candle-core", "dep:rustfft"]
python-sandbox = ["dep:ouros"]

[dependencies.candle-core]
version = "0.8"
optional = true

[dependencies.rustfft]
version = "6.2"
optional = true

[dev-dependencies]
serial_test = "3.0"
