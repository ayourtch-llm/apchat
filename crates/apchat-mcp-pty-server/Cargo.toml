[package]
name = "apchat-mcp-pty-server"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing PTY terminal session tools via JSON-RPC 2.0 over stdio"

[[bin]]
name = "apchat-mcp-pty-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
apchat-common = { path = "../apchat-common" }
apchat-terminal = { path = "../apchat-terminal" }
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
