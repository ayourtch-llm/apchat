[package]
name = "apchat-vty"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
apchat-mspc = { path = "../apchat-mspc" }
apchat-models = { path = "../apchat-models" }
apchat-logging = { path = "../apchat-logging" }
chrono = { version = "0.4.42", features = ["serde"] }
colored = "2.1"
reqwest = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["fs", "io-util"] }
crossterm = "0.28"
libc = "0.2"
once_cell = "1.20"

[dev-dependencies]
tempfile = "3"
